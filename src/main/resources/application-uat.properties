# ---- uat profile ----

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:audit_log_uat}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.com.example.audit=INFO

security.write-api.username=${WRITE_API_USER}
security.write-api.password=${WRITE_API_PASS}

security.audit-api.username=${AUDIT_API_USER}
security.audit-api.password=${AUDIT_API_PASS}
