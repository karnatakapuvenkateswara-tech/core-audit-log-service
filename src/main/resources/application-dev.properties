# ---- dev profile ----

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit_log_dev}
spring.datasource.username=${DB_USERNAME:audit_dev}
spring.datasource.password=${DB_PASSWORD:audit_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoint.health.show-details=always

logging.level.root=DEBUG
logging.level.com.example.audit=DEBUG
