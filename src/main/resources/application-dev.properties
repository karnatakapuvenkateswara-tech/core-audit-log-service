# ---- dev profile ----

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit_log_dev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.preferQueryMode=simple

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoint.health.show-details=always

logging.level.root=DEBUG
logging.level.com.example.audit=DEBUG

security.write-api.username=${WRITE_API_USER:audit_writer_dev}
security.write-api.password=${WRITE_API_PASS:audit_writer_dev}
