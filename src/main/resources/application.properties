spring.application.name=core-audit-log-service

# Active profile is selected via SPRING_PROFILES_ACTIVE env var (dev|uat|prod), default dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Write API BasicAuth credentials (env-var driven, see per-profile files)
security.write-api.username=${WRITE_API_USER:}
security.write-api.password=${WRITE_API_PASS:}

# Compliance/audit-report API BasicAuth credentials (env-var driven, see per-profile files)
security.audit-api.username=${AUDIT_API_USER:}
security.audit-api.password=${AUDIT_API_PASS:}

# Logging
logging.level.root=INFO
logging.level.com.example.audit=INFO

# Records older than this (by receivedAt) become eligible for archiving.
audit.archival.after=P90D
# How often the archival sweep runs.
audit.archival.sweep-interval=PT1H
