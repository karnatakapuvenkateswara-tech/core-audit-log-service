# In-memory database so the Spring context loads without an external Postgres instance.
spring.datasource.url=jdbc:h2:mem:audit_log_test;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update

security.write-api.username=audit_writer_test
security.write-api.password=audit_writer_test

security.audit-api.username=audit_reader_test
security.audit-api.password=audit_reader_test
